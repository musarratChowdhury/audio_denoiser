name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # ghcr.io/<owner>/audio_denoiser

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (light — no torch; unit tests mock the model)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart jinja2 httpx pytest pydantic-settings
      - name: Run tests
        run: |
          # DENOISER_* envs are read by app/config.py; model download is lazy so
          # health/index tests run without torch installed.
          python -m pytest tests/ -q
        env:
          PYTHONPATH: .

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DENOISER_MODEL=dns48

  deploy-aca:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required: azure/login OIDC cannot mint a token without this
    # Skips gracefully until you wire Azure secrets (see infra/containerapp.md).
    environment: production
    steps:
      - name: Check Azure secrets present
        id: gate
        run: |
          missing=""
          for s in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACA_APP_NAME ACA_RESOURCE_GROUP; do :; done
          [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "${{ secrets.AZURE_TENANT_ID }}" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "${{ secrets.ACA_APP_NAME }}" ] || missing="$missing ACA_APP_NAME"
          [ -n "${{ secrets.ACA_RESOURCE_GROUP }}" ] || missing="$missing ACA_RESOURCE_GROUP"
          if [ -z "$missing" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; else echo "skip=true" >> "$GITHUB_OUTPUT"; echo "missing:$missing"; fi
      - uses: azure/login@v2
        if: steps.gate.outputs.skip == 'false'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App to new image
        if: steps.gate.outputs.skip == 'false'
        run: |
          # github.repository preserves owner casing (musarratChowdhury) but
          # registries require lowercase repo paths — ACA's pull fails (exit
          # 125) on uppercase. metadata-action already lowercases when pushing.
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          az containerapp update \
            --name "${{ secrets.ACA_APP_NAME }}" \
            --resource-group "${{ secrets.ACA_RESOURCE_GROUP }}" \
            --image "ghcr.io/${REPO_LC}:sha-${{ github.sha }}" \
            --output none
      - name: Skipped (no Azure secrets)
        if: steps.gate.outputs.skip == 'true'
        run: echo "ACA deploy skipped — add AZURE_* / ACA_* secrets per infra/containerapp.md"
